name: Build Android APK

# Runs entirely on GitHub's servers — no local Android Studio or PC needed.
# Trigger manually from the GitHub app/website ("Run workflow"), or on every
# push to main. Download the resulting APK from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No `cache: npm` here — that requires a package-lock.json committed
          # to the repo. If you later commit one (from running `npm install`
          # locally), you can add `cache: npm` back for faster builds.

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        # `npm ci` also requires a committed package-lock.json — using
        # `npm install` instead since this repo doesn't commit one.
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipvault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
